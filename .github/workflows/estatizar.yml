name: Estatizar web (sin /api ni /cdn-cgi)
on:
  push:
    paths: ['tools/estatizar.py', '.github/workflows/estatizar.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  estatizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/estatizar.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Estatizar: redes (YT/IG/TT/X), Shorts embebidos + VideoObject, search.json"
          git push
